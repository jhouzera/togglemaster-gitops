{{- if .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.secretEnv }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.externalSecrets.targetSecretName }}
  namespace: {{ $svc.namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStore.name }}
    kind: {{ $.Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ $.Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
  data:
    {{- range $secretEnv := $svc.secretEnv }}
    - secretKey: {{ $secretEnv.secretKey }}
      remoteRef:
        key: {{ required (printf "services.%s.secretEnv.remoteKey is required" $name) $secretEnv.remoteKey }}
        {{- if $secretEnv.remoteProperty }}
        property: {{ $secretEnv.remoteProperty }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
