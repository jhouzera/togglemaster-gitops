{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $svc.namespace }}
  labels:
{{ include "togglemaster.labels" $ | indent 4 }}
    app: {{ $svc.name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      {{- if $svc.serviceAccountName }}
      serviceAccountName: {{ $svc.serviceAccountName }}
      {{- end }}
      {{- if and (hasKey $svc "initDb") $svc.initDb.enabled }}
      initContainers:
        - name: init-{{ $name }}-db
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "Aguardando banco {{ $name }}..."
                sleep 2
              done
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /init/init.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalSecrets.targetSecretName }}
                  key: {{ (index $svc.secretEnv 0).secretKey }}
          volumeMounts:
            - name: {{ $name }}-db-init
              mountPath: /init
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: {{ if $svc.image.digest }}{{ $svc.image.repository }}@{{ $svc.image.digest }}{{ else }}{{ $svc.image.repository }}:{{ $svc.image.tag }}{{ end }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          env:
            {{- range $envName, $envValue := $svc.env }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
            {{- range $secretEnv := $svc.secretEnv }}
            - name: {{ $secretEnv.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalSecrets.targetSecretName }}
                  key: {{ $secretEnv.secretKey }}
            {{- end }}
          resources:
{{ toYaml $svc.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.containerPort }}
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.containerPort }}
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
      {{- if and (hasKey $svc "initDb") $svc.initDb.enabled }}
      volumes:
        - name: {{ $name }}-db-init
          configMap:
            name: {{ $svc.initDb.configMapName }}
      {{- end }}
{{- end }}
{{- end }}
