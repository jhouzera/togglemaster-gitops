name: Validate GitOps Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - charts/togglemaster/**
      - environments/dev/**
      - bootstrap/applicationsets/**
      - .github/workflows/validate-gitops.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm and YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          python - <<'PY'
          from pathlib import Path

          import yaml

          paths = [Path("bootstrap/applicationsets")]
          paths.extend(Path("environments/dev/apps").glob("*-values.yaml"))

          for path in paths:
              files = path.rglob("*.yaml") if path.is_dir() else [path]
              for file in files:
                  with file.open(encoding="utf-8") as stream:
                      yaml.safe_load_all(stream)
          PY

      - name: Lint chart
        run: helm lint charts/togglemaster

      - name: Render dev applications
        run: |
          for service in auth flag targeting evaluation analytics; do
            helm template "togglemaster-${service}" charts/togglemaster \
              -f charts/togglemaster/values.yaml \
              -f "environments/dev/apps/${service}-values.yaml" >/dev/null
          done