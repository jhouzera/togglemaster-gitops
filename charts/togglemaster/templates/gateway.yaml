{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: togglemaster-gateway
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-auth-service
  namespace: {{ .Values.services.auth.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.gateway.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Values.services.auth.name }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-flag-service
  namespace: {{ .Values.services.flag.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.gateway.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Values.services.flag.name }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-targeting-service
  namespace: {{ .Values.services.targeting.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.gateway.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Values.services.targeting.name }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-evaluation-service
  namespace: {{ .Values.services.evaluation.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.gateway.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Values.services.evaluation.name }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-edge-analytics-service
  namespace: {{ .Values.services.analytics.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Values.gateway.namespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Values.services.analytics.name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: togglemaster-routes
  namespace: {{ .Values.gateway.namespace }}
spec:
  parentRefs:
    - name: togglemaster-gateway
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ .Values.services.auth.name }}
          namespace: {{ .Values.services.auth.namespace }}
          port: {{ .Values.services.auth.servicePort }}
    - matches:
        - path:
            type: Exact
            value: /flags/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.services.flag.name }}
          namespace: {{ .Values.services.flag.namespace }}
          port: {{ .Values.services.flag.servicePort }}
    - matches:
        - path:
            type: PathPrefix
            value: /flags
      backendRefs:
        - name: {{ .Values.services.flag.name }}
          namespace: {{ .Values.services.flag.namespace }}
          port: {{ .Values.services.flag.servicePort }}
    - matches:
        - path:
            type: Exact
            value: /rules/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.services.targeting.name }}
          namespace: {{ .Values.services.targeting.namespace }}
          port: {{ .Values.services.targeting.servicePort }}
    - matches:
        - path:
            type: PathPrefix
            value: /rules
      backendRefs:
        - name: {{ .Values.services.targeting.name }}
          namespace: {{ .Values.services.targeting.namespace }}
          port: {{ .Values.services.targeting.servicePort }}
    - matches:
        - path:
            type: Exact
            value: /targeting/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.services.targeting.name }}
          namespace: {{ .Values.services.targeting.namespace }}
          port: {{ .Values.services.targeting.servicePort }}
    - matches:
        - path:
            type: Exact
            value: /evaluate/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.services.evaluation.name }}
          namespace: {{ .Values.services.evaluation.namespace }}
          port: {{ .Values.services.evaluation.servicePort }}
    - matches:
        - path:
            type: Exact
            value: /evaluate
      backendRefs:
        - name: {{ .Values.services.evaluation.name }}
          namespace: {{ .Values.services.evaluation.namespace }}
          port: {{ .Values.services.evaluation.servicePort }}
    - matches:
        - path:
            type: Exact
            value: /analytics/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.services.analytics.name }}
          namespace: {{ .Values.services.analytics.namespace }}
          port: {{ .Values.services.analytics.servicePort }}
{{- end }}
